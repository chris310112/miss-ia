<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISS.IA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 30px;
        }

        .caixa {
            width: 90%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 16px 24px;
            border: none;
            border-radius: 30px;
            background: black;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #resultado {
            width: 90%;
            max-width: 600px;
            margin-top: 30px;
            font-size: 17px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>MISS.IA</h1>

    <div class="caixa">
        <input
            id="pergunta"
            type="text"
            placeholder="Pergunte alguma coisa..."
        >

        <button id="botao" onclick="pesquisar()">
            Pesquisar
        </button>
    </div>

    <div id="resultado"></div>

    <script>

        async function pesquisar() {

            const pergunta =
                document.getElementById("pergunta").value;

            const resultado =
                document.getElementById("resultado");

            const botao =
                document.getElementById("botao");

            if (pergunta.trim() === "") {
                resultado.textContent =
                    "Digite uma pergunta.";
                return;
            }

            resultado.textContent =
                "Pensando... 🧠";

            botao.disabled = true;

            try {

                const resposta = await fetch(
                    "https://miss-ia.onrender.com/perguntar",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            pergunta: pergunta
                        })
                    }
                );

                const dados = await resposta.json();

                if (dados.resposta) {

                    resultado.textContent =
                        dados.resposta;

                } else {

                    resultado.textContent =
                        "Não consegui responder agora.";
                }

            } catch (erro) {

                resultado.textContent =
                    "Erro ao conectar com a MISS.IA.";

            } finally {

                botao.disabled = false;

            }
        }

    </script>

</body>
</html>
